plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hcmarinworks.klavuz'
    compileSdk 34

    defaultConfig {
        applicationId 'com.hcmarinworks.klavuz'
        minSdk 24
        targetSdk 34
        versionCode 10
        versionName '0.10.0'
    }

    // Test APK'ları hep aynı anahtarla imzalanır; böylece yeni sürüm eskisinin üstüne kurulur, veriler silinmez.
    signingConfigs {
        test {
            storeFile file('klavuz-test.keystore')
            storePassword 'klavuztest'
            keyAlias 'klavuztest'
            keyPassword 'klavuztest'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.test
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
