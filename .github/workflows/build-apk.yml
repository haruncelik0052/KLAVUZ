name: Build APK

on:
  push:
    branches: [ilk-surum, main, ccr-2f65d271-hbxt5y, ccr-9862a3e5-483rrf, ccr-1df92bb6-t62pv1]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Web uygulamasını Android paketine kopyala
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html app.js okuyucu.js manifest.json icon.svg android/app/src/main/assets/
          cp -r vendor android/app/src/main/assets/

      - name: APK derle
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: APK dosyasını hazırla
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/Klavuz-${GITHUB_SHA::7}.apk"

      - name: APK'yı Actions çıktısı olarak kaydet
        uses: actions/upload-artifact@v4
        with:
          name: klavuz-apk
          path: out/*.apk

      - name: APK'yı test sürümü olarak yayınla
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="test-${GITHUB_SHA::7}"
          gh release create "$TAG" out/*.apk \
            --title "Klavuz test $TAG" \
            --notes "Test APK'sı. Telefonda kurmak için 'bilinmeyen kaynaklardan kuruluma izin ver' seçeneğini açmanız gerekebilir." \
            --prerelease
